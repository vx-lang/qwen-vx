# Runs the tests with a released Vx toolchain on an Apple silicon runner, because the `mlir!`
# blocks with `threads` of the program run only on a GPU.
name: CI

# Only pull requests: a macOS minute costs more than a Linux one, and a pull request merges only
# after its tests pass.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    # A run takes 5 to 8 minutes. A test that hangs stops here, not at the limit of 6 hours.
    timeout-minutes: 30
    env:
      # The oldest release that has every std::nn kernel that the program calls.
      VX_VERSION: v0.0.5
    steps:
      - uses: actions/checkout@v7

      - name: Install Vx
        run: |
          brew install --quiet llvm@22 z3
          curl -fsSL https://vxlang.org/install.sh | VX_NO_MODIFY_PATH=1 sh
          ~/.vx/current/bin/vxc --version

      # The system Python of the runner takes no packages, so they go in a venv.
      - name: Install the Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet numpy ml_dtypes filecheck

      - name: Test
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" tests/run.sh

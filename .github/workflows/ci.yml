# Runs the tests with a released Vx toolchain on an Apple silicon runner, because the `mlir!`
# blocks with `threads` of the program run only on a GPU.
name: CI

# Only pull requests: a macOS minute costs more than a Linux one, and a pull request merges only
# after its tests pass.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    # With the tests of Qwen3.6, a run takes more than 30 minutes: a RUN line that compiles the app
    # takes 90 to 115 s on this runner. A test that hangs stops here, not at the limit of 6 hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The file VX_VERSION names the Vx release that the program is tested with. The toolchain
      # needs LLVM 22 and z3 on macOS.
      - name: Install Vx
        run: |
          brew install --quiet llvm@22 z3
          version=$(cat VX_VERSION)
          curl -fsSL https://vxlang.org/install.sh | VX_VERSION="$version" VX_NO_MODIFY_PATH=1 sh
          ~/.vx/current/bin/vxc --version | grep -F "vxc ${version#v} "

      # The system Python of the runner takes no packages, so they go in a venv.
      - name: Install the Python packages
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r requirements-test.txt

      - name: Test
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" tests/run.sh
